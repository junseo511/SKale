<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SKale 월급 의사결정 Agent</title>
  <desc id="desc">월급을 생활비, 안전망, 목표 자금, 투자로 나누는 SKale 링크 썸네일</desc>
  <defs>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ea002c"/>
      <stop offset="62%" stop-color="#f20b3a"/>
      <stop offset="100%" stop-color="#ff6b18"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#7b0018" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#f7f4f3"/>
  <rect x="72" y="70" width="1056" height="490" rx="44" fill="url(#hero)" filter="url(#shadow)"/>
  <rect x="118" y="116" width="58" height="58" rx="17" fill="#fff"/>
  <text x="136" y="156" fill="#ea002c" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="900">S</text>
  <text x="196" y="154" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="850">SKale</text>
  <text x="118" y="272" fill="#fff8e8" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900">이번 월급,</text>
  <text x="118" y="362" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900">어떻게 나눌까요?</text>
  <text x="122" y="426" fill="#ffe7dd" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600">월급만 입력하면 기본 배분안을 만들고, 대화로 조율해요.</text>
  <g transform="translate(754 172)">
    <rect width="116" height="116" rx="28" fill="#ffffff" opacity=".16"/>
    <text x="58" y="66" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">생활비</text>
  </g>
  <g transform="translate(896 172)">
    <rect width="116" height="116" rx="28" fill="#ffffff" opacity=".16"/>
    <text x="58" y="66" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">안전망</text>
  </g>
  <g transform="translate(825 318)">
    <rect width="116" height="116" rx="28" fill="#ffffff" opacity=".16"/>
    <text x="58" y="66" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">투자</text>
  </g>
</svg>
